<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #ivelany,body{
            background-color:#1a2e35;height: 800px;width: 500px;position: absolute;
        }
        #ivelany{
            position: absolute;
            left:80px;
        }
        #anaty{
            background-color: aquamarine;
            width: 400px;
            height: 600px;
            z-index: 2;
        }
        
        #formulaire{
            width: 700px;  
            background-color:#1a2e35;
            height: 600px;
            position: absolute; 
            top:10px;
            left: 500px;   
            z-index: 1; 
        }
        #sary{
            position: absolute;
            top: 80px;
            left: 60px;
            z-index: 3;
        }
        #flex1,#flex2,#flex3,#flex4,#flex5{
            margin-left: 90px;
            margin-top: 40px;
        }
        input{
            width: 200px;
            padding: 8px;
            border-radius: 8px;
        }
        label{
        display: block;
        color:white;
        }
        #flex4,#flex5{
            margin-top: 100px;
        }
        #flex4{
            position: absolute;
            left: 300px;
            top: 10px;

        }
        #flex5{

            left: 300px;
            top: 160px;

        }
        #boutton{
            width: 200px;
            height: 40px;
            position: absolute;
            left: 250px;
            top: 500px;
            border-radius: 8px;
            background-color:cyan;
            color:black;
            font-size: 20px;
            font-family: 'Times New Roman', Times, serif;
            transition: 1s;

        }
        #boutton:hover{
            background-color:#1a2e35;
            color: white;

        }

    </style>
</head>
<body>

        </div>

            <div id="flex2">
                <label>
                    Prenom
                </label>
                <input type="text" placeholder="Prenom" name="Prenom">

            </div>
            <div id="flex3">

                </label>
                <input type="text" placeholder="Contact" name="contact">
                <label>
                    Statut

                <input type="text" placeholder="statut" name="Statut">
            </div>

                </label>

                    Numero Tarif
                </label>
                <input type="text" placeholder="Numero Tarif" name="Numerotarif2">
            </div>
            <button type="submit" id="boutton">Enregistrer</button>








        </div>
        </form>
